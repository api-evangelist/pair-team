name: Pair Team
description: 'Pair Team, PBC is a healthcare care-coordination company that pairs clinical
  care teams with technology to deliver comprehensive care management for underserved and
  vulnerable populations. It runs Enhanced Care Management for Medi-Cal (California Medicaid)
  members and a Medicare support program, coordinating housing assistance, food access,
  behavioral and mental health support, appointment scheduling, medication management,
  and transportation for people managing chronic conditions and social determinants of
  health. Its Flora AI care advocate helps triage and connect members to resources and
  escalates to clinical staff. Backed by Craft Ventures. Pair Team publishes no public
  developer API, SDK, or documentation surface at this time; this profile captures its
  company identity and public web properties.'
